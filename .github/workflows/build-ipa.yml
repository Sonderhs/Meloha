name: Build Meloha IPA

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/ipa-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iPhone IPA
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Check folder import
        run: |
          xcrun swiftc SubtitlePlayer/AlbumModels.swift SubtitlePlayer/LibraryStorage.swift SubtitlePlayer/FolderImport.swift tests/FolderImportChecks.swift -o "$RUNNER_TEMP/folder-import-checks"
          "$RUNNER_TEMP/folder-import-checks"

      - name: Check library storage and backups
        run: |
          xcrun swiftc SubtitlePlayer/AlbumModels.swift SubtitlePlayer/LibraryStorage.swift SubtitlePlayer/BackupArchive.swift tests/LibraryStorageChecks.swift -o "$RUNNER_TEMP/library-storage-checks"
          "$RUNNER_TEMP/library-storage-checks"

      - name: Prepare Metal compiler
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version

      - name: Build and package IPA
        shell: bash
        run: |
          set -o pipefail
          bash build-ipa.sh 2>&1 | tee build-ipa.log
          mkdir -p artifacts
          cp ../dist/Meloha.ipa artifacts/Meloha.ipa
          unzip -t artifacts/Meloha.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Meloha-unsigned-ipa
          path: artifacts/Meloha.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Meloha-build-log
          path: build-ipa.log
          if-no-files-found: ignore
          retention-days: 7
